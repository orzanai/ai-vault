<style>
:root{
  --paper:#F7F6F3; --grid:rgba(55,53,47,.06); --card:#FFFFFF; --line:#E3E2E0;
  --ink:#37352F; --ink-2:#787774; --muted:#B4B4B0;
  --blue:#2383E2; --blue-soft:rgba(35,131,226,.12);
  --red:#E03E3E; --red-soft:#FBE4E4; --green:#0F7B6C; --orange:#D9730D;
  --shadow:0 1px 2px rgba(15,15,15,.04),0 6px 24px rgba(15,15,15,.06);
  --serif:"Instrument Serif",Georgia,serif; --sans:Inter,system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--sans);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;background-attachment:fixed;min-height:100vh}
a{color:inherit}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}
/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:500 13px var(--mono);letter-spacing:.02em}
.brand img{width:30px;height:30px}
.links{display:flex;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--line);background:var(--card);
  border-radius:999px;font:500 13px var(--sans);text-decoration:none;color:var(--ink);box-shadow:0 1px 2px rgba(15,15,15,.04);transition:transform .15s,border-color .15s}
.pill:hover{transform:translateY(-1px);border-color:var(--muted)}
.pill svg{width:15px;height:15px}
/* hero */
.hero{display:grid;grid-template-columns:1fr auto;align-items:center;gap:24px;padding:28px 0 8px}
.eyebrow{font:500 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin:0 0 10px}
h1{font:700 clamp(40px,8vw,68px)/1 var(--sans);letter-spacing:-.035em;margin:0}
h1 em{font:400 italic 1.12em/1 var(--serif);color:var(--blue);letter-spacing:-.01em}
.lede{color:var(--ink-2);font-size:18px;max-width:30em;margin:16px 0 0}
.mascot{position:relative;width:clamp(120px,22vw,190px);aspect-ratio:1;animation:bob 5s ease-in-out infinite}
.mascot img{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 8px 18px rgba(15,15,15,.12))}
.mascot .blink{opacity:0}
.mascot.blinking .blink{opacity:1}
.mascot.blinking .open{opacity:0}
.bubble{position:absolute;left:-8px;top:2px;transform:translateX(-100%);background:var(--card);border:1px solid var(--line);
  border-radius:14px 14px 4px 14px;padding:7px 11px;font:500 13px var(--sans);white-space:nowrap;box-shadow:var(--shadow)}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-6px) rotate(1.5deg)}}
/* search */
.search{margin:28px 0 8px;position:relative}
.search input{width:100%;padding:16px 18px 16px 48px;border:1px solid var(--line);border-radius:14px;background:var(--card);
  font:500 16px var(--sans);color:var(--ink);box-shadow:var(--shadow);outline:none;transition:border-color .15s,box-shadow .15s}
.search input:focus{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-soft)}
.search svg{position:absolute;left:17px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--ink-2)}
.hint{font:13px var(--sans);color:var(--ink-2);margin:6px 2px 0}
.hint b{font:500 12px var(--mono);background:var(--blue-soft);color:var(--blue);padding:2px 6px;border-radius:5px}
/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin:26px 0 40px}
.card{position:relative;display:flex;flex-direction:column;gap:10px;padding:20px;background:var(--card);border:1px solid var(--line);
  border-radius:16px;box-shadow:var(--shadow);text-decoration:none;color:var(--ink);overflow:hidden;transition:transform .18s,border-color .18s}
.card:hover{transform:translateY(-3px);border-color:var(--blue)}
.ghost{position:absolute;right:14px;bottom:-22px;font:italic 400 110px/1 var(--serif);color:rgba(55,53,47,.07);pointer-events:none}
.kw{align-self:flex-start;font:500 12px var(--mono);letter-spacing:.06em;background:var(--blue-soft);color:var(--blue);padding:4px 8px;border-radius:6px}
.card h3{margin:0;font:650 19px/1.3 var(--sans);letter-spacing:-.01em;font-weight:650}
.card p{margin:0;color:var(--ink-2);font-size:14.5px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.tag{font:12px var(--sans);color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.card .go{font:600 14px var(--sans);color:var(--blue)}
.soon{border-style:dashed;box-shadow:none;background:transparent;justify-content:center;align-items:flex-start;color:var(--ink-2)}
.soon:hover{transform:none;border-color:var(--line)}
.empty{grid-column:1/-1;text-align:center;color:var(--ink-2);padding:40px 0}
/* detail */
.detail{margin:22px 0 48px}
.back{display:inline-flex;align-items:center;gap:6px;font:500 14px var(--sans);color:var(--ink-2);text-decoration:none;margin-bottom:16px}
.back:hover{color:var(--ink)}
.dhead{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 24px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.dhead .ghost{font-size:150px;bottom:-34px}
.dhead>*:not(.ghost){position:relative;z-index:1}
.btn{text-decoration:none}
.dhead h2{font:700 clamp(26px,5vw,38px)/1.15 var(--sans);letter-spacing:-.025em;margin:12px 0 10px;max-width:16em}
.quote{font:italic 400 21px/1.35 var(--serif);color:var(--ink-2);margin:0 0 18px;max-width:30em}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:12px;padding:13px 18px;font:600 15px var(--sans);cursor:pointer;
  background:var(--blue);color:#fff;box-shadow:0 4px 14px rgba(35,131,226,.3);transition:transform .15s,background .15s}
.btn:hover{transform:translateY(-1px)}
.btn.ok{background:var(--green);box-shadow:0 4px 14px rgba(15,123,108,.3)}
.btn.ghostbtn{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn svg{width:17px;height:17px}
.doc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px 24px 18px;margin-top:14px;box-shadow:var(--shadow)}
.doc h2{font:650 20px var(--sans);letter-spacing:-.01em;margin:26px 0 8px}
.doc p,.doc li{color:var(--ink)}
.doc code{font:13.5px var(--mono);background:#F1F1EF;color:var(--red);padding:1px 5px;border-radius:5px}
.codewrap{position:relative;margin:16px 0}
.doc pre{position:relative;margin:0;padding-top:44px!important;background:#FBFBFA;border:1px solid var(--line);border-radius:12px;padding:18px 16px;overflow:auto;max-height:440px}
.doc pre code{display:block;background:none;color:var(--ink);padding:0;font:13px/1.6 var(--mono);white-space:pre}
.cbtn{position:absolute;right:10px;top:10px;z-index:1;font:500 12px var(--mono);border:1px solid var(--line);background:var(--card);
  border-radius:8px;padding:5px 9px;cursor:pointer;color:var(--ink)}
.cbtn.ok{color:var(--green);border-color:var(--green)}
.doc table{width:100%;border-collapse:collapse;font-size:14.5px;margin:10px 0;display:block;overflow-x:auto}
.doc th,.doc td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.doc th{font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.doc hr{display:none}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);opacity:0;background:var(--ink);color:#fff;font:500 14px var(--sans);
  padding:10px 16px;border-radius:10px;transition:.25s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:translate(-50%,0)}
footer{border-top:1px solid var(--line);padding:22px 0 40px;color:var(--ink-2);font-size:14px;display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between}
footer a{color:var(--ink);text-decoration:none;font-weight:500}
@media (max-width:620px){
  .hero{grid-template-columns:1fr;gap:6px}
  .hero .mascot{order:-1;width:118px}
  .bubble{left:auto;right:-6px;top:4px;transform:translateX(100%);border-radius:14px 14px 14px 4px}
  .lede{font-size:16.5px}
  .dhead{padding:22px 18px}.doc{padding:4px 16px 14px}
  .actions{flex-direction:column}.actions .btn{justify-content:center;width:100%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const app=document.getElementById('app');
document.getElementById('fav').href=HEAD;document.getElementById('brandimg').src=HEAD;
let VAULT=[];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COPY='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12l5 5L20 7"/></svg>';

function mascot(say){return `<div class="mascot" id="mascot">${say?`<div class="bubble">${esc(say)}</div>`:''}<img class="open" src="${HEAD}" alt="orzan mascot"><img class="blink" src="${BLINK}" alt=""></div>`}
function blinkLoop(){const m=document.getElementById('mascot');if(!m)return;m.classList.add('blinking');setTimeout(()=>m.classList.remove('blinking'),140)}
setInterval(()=>{blinkLoop();if(Math.random()<.35)setTimeout(blinkLoop,260)},3400);

function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1600)}
async function copyText(text){
  try{await navigator.clipboard.writeText(text);return true}catch(e){
    const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,text.length);let ok=false;try{ok=document.execCommand('copy')}catch(_){}
    ta.remove();return ok}
}

function home(q=''){
  app.innerHTML=`
  <section class="hero">
    <div>
      <p class="eyebrow">Free · from my reels</p>
      <h1>The AI <em>Vault</em></h1>
      <p class="lede">Every prompt and resource I give away on Instagram, in one place. Find your keyword, copy, ship.</p>
    </div>
    ${mascot('Got a keyword?')}
  </section>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Type your keyword, e.g. AUDIT" value="${esc(q)}">
  </div>
  <p class="hint">Came from a comment? Your keyword is the code, like <b>AUDIT</b>.</p>
  <section class="grid" id="grid"></section>`;
  const input=document.getElementById('q');
  input.addEventListener('input',()=>renderGrid(input.value));
  input.addEventListener('keydown',e=>{if(e.key==='Enter'){const m=filter(input.value);if(m.length===1)location.hash=m[0].id}});
  renderGrid(q);
}
function filter(q){q=q.trim().toLowerCase();if(!q)return VAULT;
  return VAULT.filter(v=>[v.keyword,v.title,v.summary,v.hook,v.type,...(v.tags||[])].join(' ').toLowerCase().includes(q))}
function renderGrid(q){
  const items=filter(q), g=document.getElementById('grid');
  g.innerHTML=items.map(v=>`
    <a class="card" href="#${esc(v.id)}">
      <span class="ghost">${esc(v.n)}</span>
      <span class="kw">${esc(v.keyword)}</span>
      <h3>${esc(v.title)}</h3>
      <p>${esc(v.summary)}</p>
      <div class="meta">${[v.type,...(v.tags||[])].map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
      <span class="go">Open →</span>
    </a>`).join('') + (q.trim()?'':`
    <div class="card soon"><span class="kw" style="background:#F1F1EF;color:var(--ink-2)">NEXT</span><h3 style="color:var(--ink-2)">More drops with every reel</h3><p>Star the repo to catch them first.</p></div>`)
    + (items.length?'':`<p class="empty">Nothing matches “${esc(q)}”. Check the spelling of your keyword.</p>`);
}

async function detail(id){
  const v=VAULT.find(x=>x.id===id||x.keyword.toLowerCase()===id.toLowerCase());
  if(!v){home();return}
  document.title=`${v.keyword} · AI Vault · @orzan.ai`;
  app.innerHTML=`
  <section class="detail">
    <a class="back" href="#">← All drops</a>
    <div class="dhead">
      <span class="ghost">${esc(v.n)}</span>
      <span class="kw">${esc(v.keyword)}</span>
      <h2>${esc(v.title)}</h2>
      <p class="quote">“${esc(v.hook)}”</p>
      <div class="actions">
        <button class="btn" id="copyMain" disabled>${COPY}<span>Copy the prompt</span></button>
        <a class="btn ghostbtn" href="https://github.com/orzanai/ai-vault/blob/main/${esc(v.file)}" target="_blank" rel="noopener">View on GitHub</a>
      </div>
    </div>
    <article class="doc" id="doc"><p style="color:var(--ink-2)">Loading…</p></article>
  </section>`;
  window.scrollTo(0,0);
  try{
    const res=await fetch(v.file,{cache:'no-cache'}); if(!res.ok) throw 0;
    let md=await res.text();
    md=md.split('\n').filter((l,i)=>!(l.startsWith('# ')&&i<2)&&!l.startsWith('From the reel:')&&!l.includes('Back to the vault')).join('\n');
    const doc=document.getElementById('doc');
    doc.innerHTML=marked.parse(md);
    doc.querySelectorAll('a[href^="http"]').forEach(a=>{a.target='_blank';a.rel='noopener'});
    const blocks=[...doc.querySelectorAll('pre')];
    blocks.forEach(pre=>{
      const b=document.createElement('button');b.className='cbtn';b.textContent='Copy';
      b.onclick=async()=>{if(await copyText(pre.querySelector('code').innerText)){b.textContent='Copied ✓';b.classList.add('ok');toast('Copied. Paste it into Claude Code');setTimeout(()=>{b.textContent='Copy';b.classList.remove('ok')},1800)}};
      const w=document.createElement('div');w.className='codewrap';pre.replaceWith(w);w.append(b,pre);
    });
    const main=document.getElementById('copyMain');
    if(blocks.length){main.disabled=false;main.onclick=async()=>{
      if(await copyText(blocks[0].querySelector('code').innerText)){main.classList.add('ok');main.innerHTML=CHECK+'<span>Copied. Paste it into Claude Code</span>';toast('Prompt copied');
        setTimeout(()=>{main.classList.remove('ok');main.innerHTML=COPY+'<span>Copy the prompt</span>'},2400)}}}
  }catch(e){
    document.getElementById('doc').innerHTML=`<p>Couldn't load this drop here. <a href="https://github.com/orzanai/ai-vault/blob/main/${esc(v.file)}">Open it on GitHub →</a></p>`;
  }
}

function route(){const id=decodeURIComponent(location.hash.slice(1));document.title='AI Vault · @orzan.ai';id?detail(id):home()}
window.addEventListener('hashchange',route);
fetch('vault.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>{VAULT=d;route()}).catch(()=>{app.innerHTML='<p class="empty">Couldn\'t load the vault. <a href="https://github.com/orzanai/ai-vault">Open it on GitHub →</a></p>'});
</script>
</body>
</html>
